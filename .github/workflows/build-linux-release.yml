name: Build Linux release

# Builds the whole workspace on Linux x64 and publishes the built tree as a
# release asset, so a small VPS can run it without compiling anything.
#   pull request to main : build and verify only, nothing is published
#   push to main (merge) : build, verify and publish a release
#   manual               : same as a push
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "doc/**", "maps/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "doc/**", "maps/**"]
  workflow_dispatch:

# A newer push to the same pull request replaces its older build; a publishing
# build is never cancelled half way.
concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm is pinned by the packageManager field in package.json.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Build workspace
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          PAPERCLIP_BUILD_COMMIT: ${{ github.sha }}
        run: pnpm build

      # Same bundle the Docker production image starts with.
      - name: Build server runtime bundle
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          PAPERCLIP_BUILD_COMMIT: ${{ github.sha }}
        run: |
          pnpm --filter @paperclipai/server build:runtime
          test -f server/dist-runtime/index.mjs
          test -d ui/dist

      # The bundle imports some packages by absolute build path; make it
      # relocatable so the tree can be unpacked anywhere, then prove it.
      - name: Make runtime bundle relocatable
        run: |
          node scripts/relocate-runtime-bundle.mjs server/dist-runtime "$GITHUB_WORKSPACE"
          # Source maps keep the build path for debugging and are never loaded.
          if grep -rl --include='*.mjs' --include='*.js' --include='*.cjs' "$GITHUB_WORKSPACE" server/dist-runtime; then
            echo "absolute build paths remain in server/dist-runtime"; exit 1
          fi
          # Every relative import the bundle makes must exist on disk.
          node scripts/check-runtime-bundle-imports.mjs server/dist-runtime

      - name: Package built tree
        if: github.event_name != 'pull_request'
        id: package
        run: |
          rm -rf packages/paperclip-runner/runner/target
          NAME="paperclip-linux-x64-${GITHUB_SHA::8}.tar.gz"
          tar --exclude=./.git -czf "$RUNNER_TEMP/$NAME" -C "$GITHUB_WORKSPACE" .
          cd "$RUNNER_TEMP"
          SIZE=$(stat -c %s "$NAME")
          echo "Archive size: $SIZE bytes"
          # A release asset is limited to 2 GiB; split when it would not fit.
          if [ "$SIZE" -gt 1900000000 ]; then
            split -b 1800M -d "$NAME" "$NAME.part"
            rm "$NAME"
          fi
          sha256sum paperclip-linux-x64-* > SHA256SUMS
          ls -la
          echo "dir=$RUNNER_TEMP" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "linux-x64-${GITHUB_RUN_NUMBER}" \
            --target "$GITHUB_SHA" \
            --title "Linux x64 build ${GITHUB_SHA::8}" \
            --notes "Built tree for Linux x64 from ${GITHUB_SHA}. If the archive is split into .partNN files, join them with cat before extracting." \
            "${{ steps.package.outputs.dir }}"/paperclip-linux-x64-* \
            "${{ steps.package.outputs.dir }}/SHA256SUMS"

      # Each release is over 1 GB; keep the newest three.
      - name: Remove old releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,createdAt             --jq 'sort_by(.createdAt) | reverse | .[3:][].tagName'             | xargs -r -I{} gh release delete {} --cleanup-tag --yes
